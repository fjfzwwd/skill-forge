# skill-forge self-gate.
# 本仓库根即 skill 内容（scripts/ 在根目录）；跨平台矩阵同时验证
# Windows / macOS / Linux 与 Python 3.9 / 3.13。零第三方依赖。
name: skill-forge gate

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  forge-gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Toolchain self-check
        shell: bash
        run: |
          python scripts/forge.py doctor .
          python scripts/forge.py selftest .

      # Clean-room acceptance: materialises a pristine copy in a temp dir and
      # runs four example paths, bench, plugin gates and ci from scratch.
      # --no-zip: a fresh checkout has no dist/ yet.
      - name: Clean-room smoke test
        shell: bash
        run: |
          python scripts/forge.py smoke . --no-zip

      # On a fresh checkout there are no compiled skills yet; --allow-empty
      # lets the gate pass, while `smoke` above already exercised the full
      # chain (including an in-temp ci run) inside a pristine copy.
      - name: Drift + regression gate
        shell: bash
        run: |
          python scripts/forge.py ci . --strict --allow-empty
